name: Publish F-Droid repository
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: StillShelf release tag containing the F-Droid APK
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: fdroid-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install F-Droid tools
        run: sudo apt-get update && sudo apt-get install -y fdroidserver
      - name: Download F-Droid APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p repo
          gh release download "$RELEASE_TAG" --repo kalzEOS/stillshelf --pattern 'StillShelf-*-fdroid.apk' --dir repo
      - name: Generate signed repository index
        env:
          KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
        run: |
          set -eu
          umask 077
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fdroid.jks"
          python3 - <<'PY'
          import os, yaml
          config = {
              'repo_url': 'https://kalzeos.github.io/stillshelf-fdroid/repo',
              'repo_name': 'StillShelf',
              'repo_description': 'Official StillShelf F-Droid repository',
              'archive_older': 0,
              'keystore': os.path.join(os.environ['RUNNER_TEMP'], 'fdroid.jks'),
              'repo_keyalias': 'fdroid',
              'keystorepass': os.environ['KEYSTORE_PASSWORD'],
              'keypass': os.environ['KEY_PASSWORD'],
          }
          with open('config.yml', 'w') as f:
              yaml.safe_dump(config, f)
          PY
          fdroid update
      - name: Remove signing material
        if: always()
        run: rm -f config.yml "$RUNNER_TEMP/fdroid.jks"
      - name: Prepare Pages artifact
        run: |
          mkdir -p public
          cp -a repo public/repo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
