Name: StillShelf
Summary: Audiobookshelf and Navidrome player
Description: |-
  StillShelf is an Android client for self-hosted Audiobookshelf and Navidrome servers.

  Browse and listen to audiobooks, music and podcasts from your own libraries.
  Manage audiobook bookmarks, resume listening and download books for offline playback.
  Audiobooks in M4B and MP3 formats are supported.

  This distribution uses F-Droid for updates instead of the built-in GitHub updater.
